---
layout: default
---
<section class="panel">
    <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← Back to blog</a></p>
    <h1>
        {{ page.title }}
    </h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%b %-d, %Y" }}
    </time>
    {{ content }}
</section>
