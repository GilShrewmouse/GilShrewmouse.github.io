# Portfolio list. One block per game.
#   title    - name shown on the tile
#   role     - what you did, shown under the title
#   year     - the year the game is listed under (usually the release year, not always)
#   credited - set to false if you are not in the credits; adds "(not credited)" after the role
#   group    - use INSTEAD of year for the "Not released" section (last tab)
#   image    - cover in /assets/img/games/ (460x215). Leave empty for an empty tile.
#   url      - link opened on click. Leave empty for no link.
# Year tabs are created automatically, newest first. Inside a year, tiles are sorted A-Z by title,
# so it does not matter where in this file a game is placed - only its `year:` counts.

