# Buttons in the About block, shown in this order
# (professional first, then community, then projects and gaming).
#   label - text on the button
#   url   - where it goes (use "mailto:address" for e-mail)
#   icon  - file name (without .svg) in /assets/img/icons/. It is recolored with the site's gold via a CSS mask.
#   icon_shift - optional. Moves the icon up (negative) or down (positive), e.g. "-0.1em", when a drawing
#                looks too low or too high next to the others.
#   primary - optional. true = filled gold button (the main way to get in touch).
