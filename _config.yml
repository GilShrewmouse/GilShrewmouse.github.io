title: Ekaterina Podsevalova
description: (L)QA (L)QA in gamedev by trade, mostly silent lurker by life
url: "https://gilshrewmouse.github.io"
markdown: kramdown
permalink: /blog/:year/:month/:title/

# Show the "Blog" link in the top menu? Turn on (true) when there is a real post.
# The blog page itself always exists at /blog/.
show_blog: false

# Builds /sitemap.xml and /robots.txt (helps search engines find the pages)
plugins:
  - jekyll-sitemap

# Project files that must not be published on the website
exclude:
  - CLAUDE.md
  - README.md
  - tools
  - Gemfile
  - Gemfile.lock
  - assets/img/background.jpg   # original photo; the site uses background.webp