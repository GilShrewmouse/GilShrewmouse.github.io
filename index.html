<section id="portfolio" class="panel">
  <h2>Portfolio</h2>
  <div class="grid">
    {% for g in site.data.games %}
    <a class="tile" href="{{ g.url }}" target="_blank" rel="noopener">
      <img src="{{ g.image }}" alt="{{ g.title }}">
      <div class="tile-info">
        <h3>{{ g.title }}</h3>
        <span>{{ g.role }} · {{ g.year }}</span>
      </div>
    </a>
    {% endfor %}
  </div>
</section>
