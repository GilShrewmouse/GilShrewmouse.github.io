---
layout: default
title: Blog
---
<section class="panel">
  <h2>Blog</h2>
  {% for post in site.posts %}
  <article class="post-item">
    <time>{{ post.date | date: "%b %-d, %Y" }}</time>
    <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
  </article>
  {% endfor %}
</section>
